<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <header>
      <h1>Vice Cover Studio</h1>
      <p>Your photo, a caption, and a Vice City sunset — exported as a PNG to share.</p>
    </header>

    <section class="group">
      <h2>1 · Photos</h2>
      <div id="thumbs" class="thumbs"></div>
      <label class="file">Add photos from your machine
        <input id="photo" type="file" accept="image/*" multiple>
      </label>
      <div class="row">
        <button id="sample-boulevard" type="button" class="option">Sample · Boulevard</button>
        <button id="sample-pier" type="button" class="option">Sample · Pier</button>
      </div>
      <p class="hint">Click a thumbnail to put that photo in the selected panel. Photos stay on your machine — nothing is uploaded.</p>
    </section>

    <section class="group">
      <h2>2 · Layout</h2>
      <div id="layouts" class="row wrap"></div>
    </section>

    <section class="group">
      <h2>3 · Colour grade</h2>
      <div id="grades" class="row wrap"></div>
    </section>

    <section class="group">
      <h2>4 · Caption</h2>
      <label>Title
        <input id="title" type="text" maxlength="48" value="SUNSET HEIST">
      </label>
      <label>Subtitle
        <input id="subtitle" type="text" maxlength="48" value="OCEAN DRIVE">
      </label>
      <label>Title size
        <input id="title-size" type="range" min="0.7" max="1.4" step="0.05" value="1">
      </label>
      <div id="title-colours" class="row wrap"></div>
    </section>

    <section class="group">
      <h2>5 · Effects</h2>
      <label class="check"><input id="fx-sun" type="checkbox" checked> Sunset sun</label>
      <label class="check"><input id="fx-palms" type="checkbox" checked> Palm silhouettes</label>
      <label class="check"><input id="fx-halftone" type="checkbox" checked> Halftone dots</label>
      <label class="check"><input id="fx-grain" type="checkbox" checked> Film grain</label>
      <label class="check"><input id="fx-vignette" type="checkbox" checked> Vignette</label>
    </section>

    <section class="group">
      <h2>6 · Export size</h2>
      <div id="sizes" class="row wrap"></div>
      <button id="export" type="button" class="export">Export PNG</button>
      <p id="status" role="status"></p>
    </section>
  </section>

  <section class="stage" aria-label="Cover preview">
    <div id="preview" class="preview">
      <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
    </div>
    <p id="panel-label" class="panel-label"></p>
    <div class="panel-tools">
      <label>Zoom
        <input id="zoom" type="range" min="1" max="3" step="0.05" value="1">
      </label>
      <button id="fit" type="button" class="option">Reset framing</button>
    </div>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
